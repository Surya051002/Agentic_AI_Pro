[project]
name = "ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-assistant = "ai_assistant:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
